spack:
  include:
  - ../../common/packages.yaml
  - ../../common/repos.yaml
  - ../../common/mirrors.yaml
  - ../common/bootstrap.yaml
  - ../common/compilers.yaml
  - ../common/packages.yaml
  - ../common/upstreams.yaml
  specs:
  - hard +tests
  view: false
  concretizer:
    unify: true
  packages:
    mpi:
      require: "openmpi"
    flecsi:
      require: "%gcc@13.2.0 +flog+hdf5+kokkos+graphviz backend=mpi"
    hard:
      require: "+tests +radiation"
