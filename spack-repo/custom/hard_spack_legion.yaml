spack:
  include:
   - ../../common/packages.yaml
   - ../../common/repos.yaml
   - ../../common/mirrors.yaml
   - ../common/bootstrap.yaml
   - ../common/compilers.yaml
   - ../common/packages.yaml
   - ../common/upstreams.yaml
  specs:
   - hard
  view:
    default:
      root: .spack-env/view
      exclude: ['gcc-runtime']
  concretizer:
    unify: true
  packages:
    mpi:
      require: "openmpi"
    flecsi:
      require: "%gcc@13.2.0 +flog+hdf5+kokkos+openmp+graphviz backend=legion caliper_detail=low"
    legion:
      require: "+hdf5+kokkos+shared build_type=Release conduit=ibv network=gasnet"
    kokkos:
      require: "+serial"
    hard:
      require: "-radiation +tests"
