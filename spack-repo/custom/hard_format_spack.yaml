spack:
  include:
   - ../../common/packages.yaml
   - ../../common/repos.yaml
   - ../../common/mirrors.yaml
   - ../common/bootstrap.yaml
   - ../common/compilers.yaml
   - ../common/packages.yaml
   - ../common/upstreams.yaml
  specs:
   - hard
  view:
    default:
      root: .spack-env/view
      exclude: ['gcc-runtime']
  concretizer:
    unify: true
  packages:
    mpi:
      require: "openmpi"
    hard:
      require: "+format -radiation"
    flecsi:
      require: "+flog+hdf5 backend=mpi %gcc@13.2.0"
    kokkos:
      require: "+shared"
    llvm:
      buildable: False
      externals:
      - spec: "llvm@13.0.0 +clang"
        modules:
        - clang/13.0.0
