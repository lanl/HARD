spack:
  include:
  - ../../common/packages.yaml
  - ../../common/repos.yaml
  - ../../common/mirrors.yaml
  - ../common/bootstrap.yaml
  - ../common/compilers.yaml
  - ../common/packages.yaml
  - ../common/upstreams.yaml
  specs:
  - hard
  view: false
  concretizer:
    unify: true
  packages:
    mpi:
      require: "openmpi"
    flecsi:
      require: "+flog+hdf5 backend=mpi %gcc@13.2.0"
    hard:
      require: "+catalyst"
