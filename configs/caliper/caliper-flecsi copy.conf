# [hard]
CALI_SERVICES_ENABLE=aggregate,event,mpi,mpireport,timestamp
CALI_EVENT_TRIGGER=HARD-Execution
CALI_MPIREPORT_FILENAME=report.cali
CALI_EVENT_ENABLE_SNAPSHOT_INFO=false
CALI_TIMER_SNAPSHOT_DURATION=true
CALI_MPIREPORT_CONFIG="select HARD-Execution, 
    count(),
    min(sum#time.duration.ns) as \"min-time\", 
    max(sum#time.duration.ns) as \"max-time\", 
    percent_total(sum#time.duration.ns) as \"total-time-%\" 
    where HARD-Execution format table order by percent_total#sum#time.duration.ns desc"

