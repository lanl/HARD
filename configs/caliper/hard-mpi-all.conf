CALI_SERVICES_ENABLE=aggregate,event,mpi,timer,mpireport,recorder,report
CALI_MPI_WHITELIST=MPI_Send,MPI_Isend,MPI_Recv,MPI_Irecv,MPI_Wait,MPI_Waitall,MPI_Barrier,MPI_Bcast,MPI_Reduce,MPI_Allreduce,MPI_Allgather,MPI_Alltoall,MPI_Gather,MPI_Scatter,MPI_Finalize
CALI_MPI_MSG_TRACING=true
CALI_MPI_MSG_PATTERN=true
CALI_TIMER_SNAPSHOT_DURATION=true
CALI_EVENT_ENABLE_SNAPSHOT_INFO=false
CALI_RECORDER_FILENAME=mpi-hard-raw-%mpi.rank%.cali
CALI_REPORT_FILENAME=mpi-hard-all-%mpi.rank%.cali
CALI_MPIREPORT_FILENAME=mpi-hard-all.cali
CALI_MPIREPORT_WRITE_ON_FINALIZE=true
CALI_CHANNEL_FLUSH_ON_EXIT=false
