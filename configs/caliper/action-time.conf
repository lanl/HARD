CALI_SERVICES_ENABLE=aggregate,event,report,timer,memstat
CALI_EVENT_TRIGGER=HARD-Action
CALI_REPORT_FILENAME=actio-time-report.cali
CALI_TIMER_SNAPSHOT_DURATION=true
CALI_EVENT_ENABLE_SNAPSHOT_INFO=false
CALI_REPORT_CONFIG="select min(aggregate.slot) as "id", HARD-Action, count(), min(sum#time.duration.ns) as "time-ns", min(min#time.duration.ns) as "min-time-ns", min(avg#time.duration.ns) as "avg-time-ns", max(max#time.duration.ns) as "max-time-ns", group by HARD-Action format table"