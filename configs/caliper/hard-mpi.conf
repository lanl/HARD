CALI_SERVICES_ENABLE=aggregate,event,mpi,timer,mpireport,recorder,report
CALI_EVENT_TRIGGER=HARD-Action,HARD-Task
CALI_MPI_WHITELIST=MPI_Send,MPI_Isend,MPI_Recv,MPI_Irecv,MPI_Wait,MPI_Waitall,MPI_Barrier,MPI_Bcast,MPI_Reduce,MPI_Allreduce,MPI_Allgather,MPI_Alltoall,MPI_Gather,MPI_Scatter,MPI_Finalize
CALI_MPI_MSG_TRACING=true
CALI_MPI_MSG_PATTERN=true
CALI_TIMER_SNAPSHOT_DURATION=true
CALI_EVENT_ENABLE_SNAPSHOT_INFO=false
CALI_RECORDER_FILENAME=mpi-hard-raw-%mpi.rank%.cali
CALI_REPORT_FILENAME=mpi-hard-%mpi.rank%.cali
CALI_MPIREPORT_FILENAME=mpi-hard.cali
CALI_MPIREPORT_WRITE_ON_FINALIZE=true
CALI_CHANNEL_FLUSH_ON_EXIT=false

CALI_MPIREPORT_CONFIG="select min(aggregate.slot) as "id", HARD-Action, HARD-Task, mpi.function, count(), min(sum#time.duration.ns) as "time-ns", min(min#time.duration.ns) as "min-time-ns", min(avg#time.duration.ns) as "avg-time-ns", max(max#time.duration.ns) as "max-time-ns", percent_total(sum#time.duration.ns) as \"total-time-%\" group by HARD-Action,HARD-Task,mpi.function format table"

CALI_REPORT_CONFIG="select min(aggregate.slot) as "id", HARD-Action, HARD-Task, mpi.function, count(), min(sum#time.duration.ns) as "time-ns", min(min#time.duration.ns) as "min-time-ns", min(avg#time.duration.ns) as "avg-time-ns", max(max#time.duration.ns) as "max-time-ns", percent_total(sum#time.duration.ns) as \"total-time-%\" group by HARD-Action,HARD-Task,mpi.function format table"