CALI_SERVICES_ENABLE=aggregate,event,report,memstat
CALI_EVENT_TRIGGER=HARD-Task
CALI_REPORT_FILENAME=task-memory-report.cali
CALI_TIMER_SNAPSHOT_DURATION=true
CALI_EVENT_ENABLE_SNAPSHOT_INFO=false
CALI_REPORT_CONFIG="select min(aggregate.slot) as "id", HARD-Task, count(), min(sum#memstat.vmrss) as "rss-kb", min(min#memstat.vmrss) as "min-rss-kb", min(avg#memstat.vmrss) as "avg-rss-kb", min(max#memstat.vmrss) as "max-rss-kb", min(sum#memstat.vmsize) as "vm-kb", min(min#memstat.vmsize) as "min-vm-kb", avg(avg#memstat.vmsize) as "avg-vm-kb", min(max#memstat.vmsize) as "max-vm-kb", min(sum#memstat.data) as "data-kb", min(min#memstat.data) as "min-data-kb", min(avg#memstat.data) as "avg-data-kb", max(max#memstat.data) as "max-data-kb" group by HARD-Task format table"