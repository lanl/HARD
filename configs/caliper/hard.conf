CALI_SERVICES_ENABLE=aggregate,event,report,timestamp
CALI_EVENT_TRIGGER=HARD-Execution
CALI_REPORT_FILENAME=report.cali
CALI_TIMER_SNAPSHOT_DURATION=true
CALI_EVENT_ENABLE_SNAPSHOT_INFO=false
CALI_REPORT_CONFIG="select HARD-Execution,count(),min(sum#time.duration.ns) as \"min-time\",max(sum#time.duration.ns) as \"max-time\", percent_total(sum#time.duration.ns) as \"total-time-%\" group by HARD-Execution format table"