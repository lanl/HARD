CALI_SERVICES_ENABLE=aggregate,recorder,event,report,timer,memstat
CALI_EVENT_TRIGGER=HARD-Action,HARD-Task
CALI_REPORT_FILENAME=hard-report.cali
CALI_RECORDER_FILENAME=hard-raw.cali
CALI_TIMER_SNAPSHOT_DURATION=true
CALI_EVENT_ENABLE_SNAPSHOT_INFO=false
CALI_REPORT_CONFIG="select min(aggregate.slot) as "id", HARD-Action, HARD-Task, count(), min(sum#time.duration.ns) as "time-ns", min(min#time.duration.ns) as "min-time-ns", min(avg#time.duration.ns) as "avg-time-ns", max(max#time.duration.ns) as "max-time-ns", percent_total(sum#time.duration.ns) as \"total-time-%\", min(sum#memstat.vmrss) as "rss-kb", min(min#memstat.vmrss) as "min-rss-kb", min(avg#memstat.vmrss) as "avg-rss-kb", min(max#memstat.vmrss) as "max-rss-kb", min(sum#memstat.vmsize) as "vm-kb", min(min#memstat.vmsize) as "min-vm-kb", avg(avg#memstat.vmsize) as "avg-vm-kb", min(max#memstat.vmsize) as "max-vm-kb", min(sum#memstat.data) as "data-kb", min(min#memstat.data) as "min-data-kb", min(avg#memstat.data) as "avg-data-kb", max(max#memstat.data) as "max-data-kb" group by HARD-Action,HARD-Task format table"